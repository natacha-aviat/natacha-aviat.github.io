<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda ANY — rencontres Accueil New York</title>
  <meta name="description" content="Agenda des rencontres de l’Accueil New York, du jour jusqu’à août : une ligne par semaine, filtres par catégorie, horaire, jour, lieu et quartier.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,680;1,9..144,560&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="any/favicon.png">
  <link rel="stylesheet" href="any/agenda.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <p class="kicker">Accueil New York</p>
      <h1>Agenda de l’ANY</h1>
      <p class="lede" id="lede"></p>
    </header>
    <div class="layout">
      <aside class="filters" aria-label="Filtres">
        <div class="filter-col">
          <h2>Recherche</h2>
          <input class="search" id="q" type="search" placeholder="Titre, animateur, lieu…" autocomplete="off">
          <h2>Catégories</h2>
          <div class="cats" id="cats"></div>
        </div>
        <div class="filter-col">
          <h2>Jours affichés</h2>
          <div class="days" id="days" role="group" aria-label="Jours de la semaine"></div>
          <h2>Créneau horaire</h2>
          <div class="hours-label"><span id="hLabel">9 h – 17 h</span></div>
          <div class="slider" id="slider">
            <div class="slider-track"></div>
            <div class="slider-fill" id="sliderFill"></div>
            <input type="range" id="h0" min="7" max="22" value="9" aria-label="Début du créneau">
            <input type="range" id="h1" min="7" max="22" value="17" aria-label="Fin du créneau">
          </div>
          <div class="scale"><span>7 h</span><span>12 h</span><span>17 h</span><span>22 h</span></div>
          <h2>Quartier</h2>
          <div class="areas" id="areas"></div>
          <h2>Lieu</h2>
          <div class="lieu"><select id="place" aria-label="Filtrer par lieu"></select></div>
          <h2>Affichage</h2>
          <label class="check"><input type="checkbox" id="showWait" checked> <span>Sur liste d'attente</span></label>
          <label class="check"><input type="checkbox" id="showFull"> <span>Complètes</span></label>
          <label class="check"><input type="checkbox" id="onlyNew"> <span>Uniquement les nouveautés</span></label>
          <label class="check"><input type="checkbox" id="emptyWeeks"> <span>Afficher les semaines vides</span></label>
          <div class="row-actions">
            <button type="button" class="ghost" id="reset">Réinitialiser les filtres</button>
          </div>
        </div>
      </aside>
      <main class="main">
        <div class="status" id="status" aria-live="polite"></div>
        <div class="table-scroll">
          <table aria-label="Agenda, une ligne par semaine">
            <thead>
              <tr id="head">
                <th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th><th>Dim</th>
              </tr>
            </thead>
            <tbody id="body"></tbody>
          </table>
        </div>
        <p class="note" id="note"></p>
      </main>
    </div>
  </div>

  <dialog id="detail" aria-labelledby="detailTitle">
    <div class="sheet">
      <div class="sheet-top">
        <div>
          <p class="catname" id="detailCat"></p>
          <h2 id="detailTitle"></h2>
          <p class="when" id="detailWhen"></p>
        </div>
        <button type="button" class="close" id="detailClose">Fermer</button>
      </div>
      <div id="detailBadge"></div>
      <dl>
        <dt>Animateur</dt><dd id="detailWho"></dd>
        <dt>Lieu</dt><dd id="detailPlace"></dd>
        <dt>Quartier</dt><dd id="detailArea"></dd>
      </dl>
      <div class="desc" id="detailDesc"></div>
      <a class="official" id="detailLink" href="" target="_blank" rel="noopener noreferrer">Voir la fiche sur le site de l’ANY</a>
    </div>
  </dialog>

  <script type="module" src="any/agenda.js"></script>
</body>
</html>
