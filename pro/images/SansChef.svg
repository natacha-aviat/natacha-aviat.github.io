<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sans chef — de la pyramide au cercle</title>
  <desc id="desc">Avant : hiérarchie en triangle. Après : équipe en cercle sans sommet.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a3a"/>
      <stop offset="50%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#1a3d52"/>
    </linearGradient>
    <linearGradient id="panelBefore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4f5f"/>
      <stop offset="100%" stop-color="#2a3845"/>
    </linearGradient>
    <linearGradient id="panelAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a5a78"/>
      <stop offset="100%" stop-color="#1e4a62"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="64" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F8F9FA" font-weight="700">Équipe sans chef</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9bb4c7">De la hiérarchie au collectif</text>

  <!-- LEFT PANEL: BEFORE / pyramid -->
  <rect x="70" y="140" width="480" height="560" rx="24" fill="url(#panelBefore)" filter="url(#soft)"/>
  <text x="310" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3" fill="#c5a17a" font-weight="700">AVANT</text>
  <text x="310" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F8F9FA">Pyramide</text>

  <!-- Pyramid structure -->
  <!-- Apex (boss) -->
  <g transform="translate(310,290)">
    <circle r="36" fill="#e67e22" filter="url(#soft)"/>
    <circle cx="-9" cy="-5" r="7" fill="#fdebd0"/>
    <circle cx="9" cy="-5" r="7" fill="#fdebd0"/>
    <rect x="-12" y="7" width="24" height="9" rx="4" fill="#fdebd0"/>
    <text y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e8c9a0">Chef</text>
  </g>

  <!-- Middle row: 2 people -->
  <g transform="translate(230,400)">
    <circle r="28" fill="#7f8c8d"/>
    <circle cx="-7" cy="-3" r="5.5" fill="#ecf0f1"/>
    <circle cx="7" cy="-3" r="5.5" fill="#ecf0f1"/>
    <rect x="-10" y="6" width="20" height="7" rx="3.5" fill="#ecf0f1"/>
  </g>
  <g transform="translate(390,400)">
    <circle r="28" fill="#7f8c8d"/>
    <circle cx="-7" cy="-3" r="5.5" fill="#ecf0f1"/>
    <circle cx="7" cy="-3" r="5.5" fill="#ecf0f1"/>
    <rect x="-10" y="6" width="20" height="7" rx="3.5" fill="#ecf0f1"/>
  </g>

  <!-- Base row: 3 people -->
  <g transform="translate(180,510)">
    <circle r="26" fill="#95a5a6"/>
    <circle cx="-6" cy="-3" r="5" fill="#ecf0f1"/>
    <circle cx="6" cy="-3" r="5" fill="#ecf0f1"/>
    <rect x="-9" y="5" width="18" height="6" rx="3" fill="#ecf0f1"/>
  </g>
  <g transform="translate(310,510)">
    <circle r="26" fill="#95a5a6"/>
    <circle cx="-6" cy="-3" r="5" fill="#ecf0f1"/>
    <circle cx="6" cy="-3" r="5" fill="#ecf0f1"/>
    <rect x="-9" y="5" width="18" height="6" rx="3" fill="#ecf0f1"/>
  </g>
  <g transform="translate(440,510)">
    <circle r="26" fill="#95a5a6"/>
    <circle cx="-6" cy="-3" r="5" fill="#ecf0f1"/>
    <circle cx="6" cy="-3" r="5" fill="#ecf0f1"/>
    <rect x="-9" y="5" width="18" height="6" rx="3" fill="#ecf0f1"/>
  </g>

  <!-- Hierarchy lines -->
  <g stroke="#e67e22" stroke-opacity="0.45" stroke-width="2" fill="none">
    <line x1="310" y1="326" x2="230" y2="372"/>
    <line x1="310" y1="326" x2="390" y2="372"/>
    <line x1="230" y1="428" x2="180" y2="484"/>
    <line x1="230" y1="428" x2="310" y2="484"/>
    <line x1="390" y1="428" x2="310" y2="484"/>
    <line x1="390" y1="428" x2="440" y2="484"/>
  </g>

  <!-- Faint triangle outline -->
  <polygon points="310,248 150,555 470,555" fill="none" stroke="#e67e22" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 8"/>

  <text x="310" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#aab4be">Un sommet · un goulot</text>

  <!-- CENTER ARROW -->
  <g transform="translate(600,420)">
    <circle r="36" fill="#3498DB" filter="url(#soft)"/>
    <path d="M-14,-2 L6,-2 L6,-10 L16,0 L6,10 L6,2 L-14,2 Z" fill="#F8F9FA"/>
  </g>

  <!-- RIGHT PANEL: AFTER / circle -->
  <rect x="650" y="140" width="480" height="560" rx="24" fill="url(#panelAfter)" filter="url(#soft)"/>
  <text x="890" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3" fill="#7dcea0" font-weight="700">APRÈS</text>
  <text x="890" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F8F9FA">Cercle</text>

  <!-- Circle ring -->
  <circle cx="890" cy="430" r="145" fill="none" stroke="#1abc9c" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="890" cy="430" r="145" fill="none" stroke="#5dade2" stroke-opacity="0.2" stroke-width="10"/>

  <!-- Empty center: no boss -->
  <circle cx="890" cy="430" r="48" fill="rgba(248,249,250,0.1)" stroke="#F8F9FA" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="890" y="425" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#d5e8f0">Sans</text>
  <text x="890" y="445" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#d5e8f0">chef</text>

  <!-- 6 equal peers on the circle -->
  <g transform="translate(890,285)">
    <circle r="30" fill="#3498DB" filter="url(#soft)"/>
    <circle cx="-8" cy="-3" r="6" fill="#ecf6fc"/>
    <circle cx="8" cy="-3" r="6" fill="#ecf6fc"/>
    <rect x="-11" y="7" width="22" height="8" rx="4" fill="#ecf6fc"/>
  </g>
  <g transform="translate(1015,360)">
    <circle r="30" fill="#1abc9c" filter="url(#soft)"/>
    <circle cx="-8" cy="-3" r="6" fill="#e8faf6"/>
    <circle cx="8" cy="-3" r="6" fill="#e8faf6"/>
    <rect x="-11" y="7" width="22" height="8" rx="4" fill="#e8faf6"/>
  </g>
  <g transform="translate(1015,500)">
    <circle r="30" fill="#5dade2" filter="url(#soft)"/>
    <circle cx="-8" cy="-3" r="6" fill="#eef6fc"/>
    <circle cx="8" cy="-3" r="6" fill="#eef6fc"/>
    <rect x="-11" y="7" width="22" height="8" rx="4" fill="#eef6fc"/>
  </g>
  <g transform="translate(890,575)">
    <circle r="30" fill="#3498DB" filter="url(#soft)"/>
    <circle cx="-8" cy="-3" r="6" fill="#ecf6fc"/>
    <circle cx="8" cy="-3" r="6" fill="#ecf6fc"/>
    <rect x="-11" y="7" width="22" height="8" rx="4" fill="#ecf6fc"/>
  </g>
  <g transform="translate(765,500)">
    <circle r="30" fill="#1abc9c" filter="url(#soft)"/>
    <circle cx="-8" cy="-3" r="6" fill="#e8faf6"/>
    <circle cx="8" cy="-3" r="6" fill="#e8faf6"/>
    <rect x="-11" y="7" width="22" height="8" rx="4" fill="#e8faf6"/>
  </g>
  <g transform="translate(765,360)">
    <circle r="30" fill="#5dade2" filter="url(#soft)"/>
    <circle cx="-8" cy="-3" r="6" fill="#eef6fc"/>
    <circle cx="8" cy="-3" r="6" fill="#eef6fc"/>
    <rect x="-11" y="7" width="22" height="8" rx="4" fill="#eef6fc"/>
  </g>

  <!-- Rotation hint -->
  <path d="M960 300 A120 120 0 0 1 1020 420" fill="none" stroke="#F8F9FA" stroke-width="2.5" stroke-linecap="round" opacity="0.55" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F8F9FA"/>
    </marker>
  </defs>

  <text x="890" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a8d5c4">Pairs égaux · rôles tournants</text>
</svg>
