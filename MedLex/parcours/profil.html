<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil · MedLex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/parcours.css" />
</head>
<body class="ac-page ac-page--app ac-page--profil">
  <header class="ac-dash-header">
    <a class="ac-logo" href="../index.html"><span class="ac-logo__dot" aria-hidden="true"></span>MedLex</a>
  </header>
  <main class="ac-main">
    <div class="ac-avatar" role="img" aria-label="Avatar"></div>
    <label class="ac-label">Nom<input class="ac-input" type="text" name="nom" placeholder="Ton nom de famille" /></label>
    <p class="ac-field-hint">Ex : Macron</p>
    <label class="ac-label ac-spacer-sm">Prénom<input class="ac-input" type="text" name="prenom" placeholder="Tous tes prénoms" /></label>
    <p class="ac-field-hint">Ex : Brigitte Caroline</p>
    <label class="ac-label ac-spacer-sm">Adresse<input class="ac-input" type="text" name="adresse" placeholder="L'adresse de ton cabinet" /></label>
    <label class="ac-label ac-spacer-sm">Ville<input class="ac-input" type="text" name="ville" placeholder="La ville de ton cabinet" /></label>
    <label class="ac-check ac-spacer-lg"><input type="checkbox" checked /> Abonnement à la newsletter</label>
    <label class="ac-check"><input type="checkbox" /> Police dyslexie</label>
  </main>

  <script src="../js/shell.js"></script>
</body></html>
