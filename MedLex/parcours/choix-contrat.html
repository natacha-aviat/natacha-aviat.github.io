<body class="ac-page ac-page--app">
  <div class="ac-page">
    <header class="ac-shell-header">
      <div class="ac-shell-header__row">
        <a class="ac-logo" href="../index.html"><span class="ac-logo__dot" aria-hidden="true"></span>MedLex</a>
        <a class="ac-back" href="../index.html">← Retour</a>
      </div>
    </header>
    <main class="ac-main">
      <h1 class="ac-title ac-title--page">Quel type de contrat ?</h1>
      <p class="ac-microcopy ac-spacer-sm">
        On adapte le questionnaire et les clauses à ta situation.
      </p>
      <div class="ac-stack-sm ac-spacer-lg">
        <button type="button" class="ac-choice ac-choice--selected" data-select="parcours" data-value="remplacement">
          <p class="ac-choice__title">Contrat de remplacement</p>
          <p class="ac-choice__desc">Tu remplaces une collègue temporairement (congé, maladie, maternité…)</p>
        </button>
        <button type="button" class="ac-choice" data-select="parcours" data-value="collaboration">
          <p class="ac-choice__title">Contrat de collaboration libérale</p>
          <p class="ac-choice__desc">Tu travailles avec une consœur sur la durée, en cabinet partagé</p>
        </button>
        <button type="button" class="ac-choice" data-select="parcours" data-value="bail-professionnel">
          <p class="ac-choice__title">Bail professionnel</p>
          <p class="ac-choice__desc">Tu loues un local pour ton cabinet infirmier libéral</p>
        </button>
        <button type="button" class="ac-choice" data-select="parcours" data-value="fin-de-bail">
          <p class="ac-choice__title">Fin de bail professionnel</p>
          <p class="ac-choice__desc">Congé amiable à l’initiative du locataire ou du propriétaire</p>
        </button>
        <button type="button" class="ac-choice" data-select="parcours" data-value="mise-en-demeure">
          <p class="ac-choice__title">Mise en demeure du bailleur</p>
          <p class="ac-choice__desc">Tu es locataire et tu reproches une faute au propriétaire — premier courrier avant une éventuelle résolution</p>
        </button>
      </div>
      <button type="button" class="ac-btn ac-btn--primary" id="choix-next">Suivant</button>
      <p class="ac-microcopy--xs ac-spacer-sm">Tu pourras revenir en arrière à tout moment.</p>
    </main>
  </div>
